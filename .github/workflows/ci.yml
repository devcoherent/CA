name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder values so the production build compiles. Real values live in Cloudflare Pages.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: public-anon-key-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production bundle has no demo code or fake data
        run: npm run check:bundle
      - name: Self-test the bundle check (a demo build must be detected)
        run: npm run check:bundle:selftest

  database:
    name: Database tests (RLS, timers, kickoff, signup roles)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase (only the services the tests need)
        run: supabase start -x studio,imgproxy,vector,logflare,postgres-meta,supavisor,edge-runtime
      - name: Apply migrations and seed
        run: supabase db reset
      - run: npm run test:db
